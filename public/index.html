<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Espinho Updates</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="container">
      <header>
        <h1>Espinho Updates</h1>
        <p class="subtitle">Rascunho diário local com base em fontes públicas verificáveis.</p>
      </header>

      <section class="card">
        <h2>Última atualização</h2>
        <p id="latest-meta">A carregar...</p>
        <h3 id="latest-title"></h3>
        <p id="facebook-draft"></p>
        <h3>Resumo local</h3>
        <ul id="updates-list"></ul>
        <h3>Fontes verificadas</h3>
        <ul id="sources-list"></ul>
        <p class="notice">Nota: este conteúdo é um rascunho para revisão e não uma publicação oficial.</p>
      </section>

      <section class="card">
        <h2>Arquivo diário</h2>
        <ul id="archive-list"></ul>
      </section>
    </main>

    <script src="./app.js" defer></script>
  </body>
</html>
