name: Update Espinho Updates Site

on:
  workflow_dispatch:
  schedule:
    - cron: "30 19 * * *"

permissions:
  contents: write
  pages: write
  id-token: write
  models: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run automated tests
        run: npm test

      - name: Capture run date
        run: echo "EXPECTED_UPDATE_DATE=$(date -u +%F)" >> "$GITHUB_ENV"

      - name: Generate daily update JSON
        env:
          AI_PROVIDER: ${{ vars.AI_PROVIDER != '' && vars.AI_PROVIDER || 'github-models' }}
          GITHUB_MODELS_MODEL: ${{ vars.GITHUB_MODELS_MODEL != '' && vars.GITHUB_MODELS_MODEL || 'openai/gpt-4.1-mini' }}
          GITHUB_TOKEN: ${{ github.token }}
          USE_MOCK_DATA: ${{ vars.USE_MOCK_DATA != '' && vars.USE_MOCK_DATA || 'false' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: npm run generate:update

      - name: Validate generated JSON schema
        run: npm run validate:update

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/latest.json public/data/archive/
          if ! git diff --cached --quiet; then
            git commit -m "chore: update daily Espinho data"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: generate
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
